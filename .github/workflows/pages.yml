# Live demo: publish dashboard/index.html (and nothing else) to GitHub Pages.
# The page is static and offline (CSP connect-src 'none'): files a visitor loads
# are parsed in their browser and never uploaded. #demo shows synthetic data.
name: pages

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dashboard tests (offline, no remote resources)
        run: node tests/test_dashboard.cjs
      - name: assemble site (single file)
        run: mkdir -p _site && cp dashboard/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
